# C600-U 平台日测模型配置
# 对应测试矩阵 C600-U=true 的模型（Qwen3.5-35B-A3B-W8A8-FP8 / Kimi-K2.5-FP8，仅在 C600-U 平台测试）。

- name: "Qwen3.5-35B-A3B-W8A8-FP8"
  model_path: "/mxstorage/pde_ai/models/llm/Qwen/Qwen3.5-35B-A3B.w8a8"   # TODO: 验证路径（FP8 版本路径待确认）
  serve_config:
    tp: 1
    dp: 1
    pp: 1
    extra_args:
      --dtype: "bfloat16"
      --gpu-memory-utilization: 0.95
  infer_type:
    - text-only
  benchmark:
    bench_param: "configs/bench_params/bench_mainstream_highlight.json"
    ignore_eos: true
    sweep_num_runs: 1
  extra_env:

- name: "Kimi-K2.5-FP8"
  timeout: 4800
  model_path: "/mxstorage/pde_ai/models/llm/Kimi/kimi-k2.5-smq-fp-w8a8/vllm_quant_model/"
  serve_config:
    tp: 16
    dp: 1
    pp: 1
    distributed_executor_backend: mp
    extra_args:
      --dtype: "bfloat16"
      --gpu-memory-utilization: 0.9
      --max-model-len: 20480
      --max-num-batched-tokens: 8192
      --no-enable-prefix-caching:
  infer_type:
    - text-only
  benchmark:
    bench_param: "configs/bench_params/bench_mainstream_highlight.json"
    ignore_eos: true
    sweep_num_runs: 1
  extra_env:
    VLLM_METAX_SUPPORTS_FP8: 1
    MACA_VLLM_ENABLE_MCTLASS_PYTHON_API: 1
    MACA_VLLM_ENABLE_MCTLASS_FUSED_MOE: 1
    MCCL_USE_MXSML: 0
    VLLM_METAX_USE_FP8_WO_A: 0
    VLLM_METAX_ENABLE_FP8_WEIGHT: 1
    VLLM_METAX_USE_FP8_SPARSE_ATTN_INDEXER: 1
    MACA_DIRECT_DISPATCH: 1
