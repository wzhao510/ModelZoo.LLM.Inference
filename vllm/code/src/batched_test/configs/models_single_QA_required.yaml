# 单机(陆吾 C500x8, spec 45) 推理测试模型清单
# 来源: 用户在 2026-08-21 勾选的模型 (C500 列 = true), 条目从
#   configs/dailytest_models_C500.yaml / configs/model.yaml 整理
# 用法: python launch.py --infer --long-text-case configs/inference/long_text_case.yaml \
#          --model-config configs/models_single_checked_20260821.yaml
#
# 待确认项:
#   - Qwen2.5-72B-Instruct-AWQ / GPTQ-Int4: 配置路径当前在共享存储上不存在
#   - Qwen3-0.6B / Step-3.5-Flash-W8A8: 用户标注"需要更换"
#   - Qwen3-VL-Embedding-8B: embedding 模型, 以 --task embed + /v1/embeddings 用例测试

- name: Qwen2.5-72B-Instruct-AWQ
  # 注意: 该路径当前在宁夏/mxstorage 共享存储上不存在, 上海/mxstorage有
  model_path: /mxstorage/pde_ai/models/llm/Qwen/Qwen2___5-72B-Instruct-AWQ
  serve_config:
    tp: 1
    dp: 1
    pp: 1
    extra_args:
      --dtype: float16
      --gpu-memory-utilization: 0.95
  infer_type:
  - text-only
  benchmark:
    bench_param: configs/bench_params/bench_common.json
    ignore_eos: true
    sweep_num_runs: 1
  extra_env: null

