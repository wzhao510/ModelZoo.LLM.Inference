    sweep_num_runs: 1
  extra_env:
    VLLM_DISABLE_SHARED_EXPERTS_STREAM: 1

- name: DeepSeek-R1-W48A8-PCPT_NAIVE
  time: 1200
  model_path: /mxstorage/pde_ai/models/model_quant_opt/DeepSeek_W48A8/DeepSeek-R1-W48A8-PCPT_NAIVE/vllm_quant_model
  serve_config:
    tp: 8
    dp: 1
    pp: 1
    gpu_memory_utilization: 0.85
    extra_args:
      --speculative-config : '{"method": "deepseek_mtp", "num_speculative_tokens": 1}'
  infer_type:
  - text-only
  benchmark:
    bench_param: configs/bench_params/bench_high.json
    sweep_num_runs: 1
  extra_env:
    VLLM_DISABLE_SHARED_EXPERTS_STREAM: 1
    MACA_VLLM_ENABLE_MCTLASS_FUSED_MOE: 1
    MACA_VLLM_ENABLE_MCTLASS_PYTHON_API: 1

- name: DeepSeek-V4-Flash-W8A8-MTP
  timeout: 3600
  model_path: /mxstorage/pde_ai/models/model_quant_opt/DeepSeek/DeepSeek-V4-Flash_FlexSMQ-AWQ_W8A8/vllm_quant_model
  serve_config:
    tp: 8
