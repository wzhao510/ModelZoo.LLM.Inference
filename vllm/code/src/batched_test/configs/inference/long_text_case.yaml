      narrow distribution of The Stack. Evaluation on non-code benchmarks (MMLU: 71.2 → 54.3, HellaSwag: 83.1 → 67.8)
      confirmed significant degradation. The full fine-tune also introduced a syntax bias: the model became
      overly aggressive about generating complete, syntactically-valid Python even when the prompt asked for
      pseudocode or explanations. Hypothesis: the dataset was too homogeneous; needed data mixing.

    EXPERIMENT #2 — LoRA Fine-Tune (r=64, alpha=128):
    - Method: LoRA on all linear layers (q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj)
