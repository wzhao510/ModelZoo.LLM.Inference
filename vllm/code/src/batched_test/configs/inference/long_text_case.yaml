    EXPERIMENT #1 — Full Fine-Tune (All Parameters):
    - Method: Full-parameter supervised fine-tuning on 240K Python samples
    - Hardware: 32× NVIDIA A100-80GB (4 nodes × 8 GPUs)
    - Configuration: FSDP (Full Shard), bf16 mixed precision, AdamW (lr=2e-5, cosine schedule, warmup=500 steps), global batch size=128, max_seq_len=4096
