- question: |
    You are a technical writer reviewing a complex open-source project. Read the following README and architecture documentation for "River" — a distributed workflow engine — and write a comprehensive "Getting Started" guide aimed at senior backend engineers. Your guide should cover: (1) core concepts and architecture overview, (2) installation and basic configuration, (3) a complete "Hello World" workflow example with code, (4) explanation of key design decisions and trade-offs, (5) production deployment considerations. Use specific details from the documentation provided.

    ========================================================================
    RIVER: Distributed Workflow Engine v2.0.0 — Project Documentation
    ========================================================================

    OVERVIEW

    River is an open-source distributed workflow engine designed for orchestrating long-running, stateful business processes across microservice boundaries. It draws inspiration from Temporal and AWS Step Functions but is purpose-built for Kubernetes-native deployments with a focus on operational simplicity and observability. River implements the Saga pattern for distributed transactions and supports pluggable persistence backends.

    CORE CONCEPTS

    Workflow: A deterministic, durable function that defines the orchestration logic. Workflows are written in TypeScript, Python, or Go and are compiled to a deterministic bytecode that River's runtime executes. A workflow can pause for days or weeks waiting for external events, and River guarantees exactly-once execution semantics.

    Activity: A non-deterministic function that performs side effects — calling external APIs, writing to databases, sending emails. Activities are the ONLY place where non-deterministic operations are allowed. They have built-in retry logic (configurable: max retries, backoff policy, timeout) and are idempotency-guaranteed via a user-provided idempotency key.

    Signal: An asynchronous message sent to a running workflow to notify it of an external event. Workflows can `await` signals with a timeout: `const event = await signal('payment_received', { timeout: '24h' })`.

    State: River automatically persists workflow state after every activity completion and signal delivery using an event-sourcing model. The entire workflow history is stored as an append-only event log (journal). On failure or restart, the workflow is replayed from the event log, and River guarantees the workflow produces the same result as the original execution (determinism guarantee).

    ARCHITECTURE

    River consists of six core components:

    1. River Server (Go): The central control plane. Handles workflow scheduling, activity dispatch, timer management, and event log compaction. Uses Raft consensus (via Hashicorp Raft library) for leader election with 3-5 server nodes recommended for production. Exposes a gRPC API (port 7233) and an HTTP API (port 8080) for management.

    2. Worker Pool: Stateless processes that execute Activity code. Workers pull activity tasks from the River Server via long-polling gRPC streams. Each worker registers the activity types it can handle at startup. Workers are designed to run as Kubernetes Deployments with HPA (Horizontal Pod Autoscaler) based on activity queue depth.

    3. Event Store: An append-only log that records every workflow event. By default, River uses an embedded event store based on BadgerDB (LSM-tree) for single-node deployments. For production multi-node deployments, River supports PostgreSQL (v14+) and CockroachDB as external event stores. The event store is sharded by workflow_id with a configurable number of shards (default: 256).

    4. Timer Service: A distributed timer wheel implementation that manages workflow timers (sleep, await-with-timeout, schedule-at). Timers are durably stored in the event store and loaded into memory in time-sorted buckets. The timer service uses a hierarchical timing wheel (3 levels: millisecond, second, minute) to handle timers from 1ms to 30 days.

    5. Query Service: Provides a SQL-like query interface for inspecting workflow state. Supports queries like: `SELECT workflow_id, status, start_time FROM workflows WHERE workflow_type = 'OrderFulfillment' AND status = 'RUNNING'`. The query engine uses a custom parser that translates queries into index scans on the event store. Materialized views (workflows_by_type, workflows_by_status) are maintained for common query patterns.

    6. Web UI: A React-based dashboard for monitoring workflows. Shows real-time workflow execution graphs, activity metrics (P50/P95/P99 latency, success/error rate), timer status, and server health. The UI communicates with River Server via the HTTP API and uses Server-Sent Events (SSE) for real-time updates.

    DEPLOYMENT MODEL

    Minimum production deployment:
    - 3 River Server pods (Raft quorum)
    - 1 PostgreSQL instance (or external CockroachDB cluster) for event storage
    - 2+ Worker Deployments (one per activity type group, HPA enabled)
    - 1 Prometheus instance for metrics collection
    - Optional: River Web UI (1 pod)

    Resource requirements per River Server pod:
    - CPU: 2-4 cores (64-bit ARM or x86)
    - Memory: 4-8 GB RAM (event log cache is memory-mapped)
    - Disk: 100 GB SSD (only for Raft log; workflow data goes to external event store)
    - Network: 1 Gbps recommended for inter-server Raft communication

    SDK SUPPORT

    River provides SDKs for three languages:
    - TypeScript/JavaScript (Node.js 18+): Primary SDK. Supports both CommonJS and ESM. Integrates with Express, Fastify, and NestJS. Type-safe workflow and activity definitions using TypeScript decorators.
    - Python (3.10+): Supports asyncio-based workflows. Integrates with FastAPI and Django. Uses Python type hints for workflow parameter validation.
    - Go (1.21+): Minimal SDK focused on performance. Workflows are defined as functions with `river.Context` as the first parameter. Activities use `river.ActivityContext`.

    SDK design principle: All SDKs produce identical bytecode for the same workflow logic, ensuring cross-language compatibility. A workflow written in TypeScript can send signals to a workflow written in Python.

    EXAMPLE: ORDER FULFILLMENT WORKFLOW (TypeScript)

    ```typescript
    import { workflow, activity, signal, sleep } from '@riverhq/sdk';

    @activity({ retries: 3, backoff: 'exponential', timeout: '30s' })
    async function chargeCustomer(orderId: string, amount: number): Promise<string> {
      // Calls Stripe API — this is a non-deterministic side effect
      const result = await fetch('https://api.stripe.com/v1/charges', {
        method: 'POST',
        body: JSON.stringify({ amount, currency: 'usd', metadata: { orderId } }),
      });
      return result.json().id;
    }

    @activity({ retries: 5, timeout: '60s' })
    async function reserveInventory(sku: string, quantity: number): Promise<boolean> { ... }

    @activity({ retries: 0 }) // no retries for shipping — if it fails, manual intervention needed
    async function shipOrder(orderId: string, address: string): Promise<string> { ... }

    @workflow({ name: 'OrderFulfillment', version: '1.0' })
    async function orderFulfillmentWorkflow(order: Order): Promise<string> {
      // Step 1: Charge
      const chargeId = await chargeCustomer(order.id, order.total);

      // Step 2: Reserve — with compensation (Saga pattern)
      try {
        await reserveInventory(order.sku, order.quantity);
      } catch (err) {
        await refundCustomer(chargeId); // compensating action
        throw new Error('Insufficient inventory');
      }

      // Step 3: Wait for warehouse confirmation (SIGNAL — can wait days)
      const confirmed = await signal('warehouse_confirmed', { timeout: '72h' });
      if (!confirmed) {
        await refundCustomer(chargeId);
        throw new Error('Warehouse could not confirm within 72 hours');
      }

      // Step 4: Ship
      const trackingId = await shipOrder(order.id, order.shippingAddress);

      return trackingId; // workflow result
    }
    ```

    KEY DESIGN DECISIONS

    1. Why Raft instead of etcd/ZooKeeper? We embed Raft directly into River Server to avoid external dependencies. An embedded consensus library reduces operational complexity (no separate etcd cluster to manage) and allows River Server to directly couple its scheduling state machine with the Raft log. The trade-off is that Raft membership changes (adding/removing servers) require careful orchestration — we've seen operators accidentally break quorum during rolling restarts.

    2. Why BadgerDB as default event store? BadgerDB provides excellent read performance for the event-replay use case (sequential reads of workflow history) and is written in pure Go (no CGo). The LSM-tree structure naturally supports append-heavy workloads. However, BadgerDB does not support multi-node access — for HA deployments, you MUST use PostgreSQL or CockroachDB.

    3. Why bytecode compilation? Workflows must be deterministic — given the same event history, a workflow MUST produce the same sequence of activity calls and signals. By compiling workflows to a deterministic bytecode (similar to the JVM approach), River isolates non-deterministic operations (random, Date.now(), Math.random()) to activities, which are the ONLY place where non-determinism is allowed. The bytecode VM enforces this at runtime: any attempt to call a non-deterministic API from workflow code throws a `DeterminismViolationError`.

    4. Why event sourcing instead of snapshotting? Event sourcing provides an audit trail for every state transition (critical for financial workflows). It also enables "workflow replay" for debugging: you can replay a workflow's entire execution history to reproduce bugs. The trade-off is storage cost — a long-running workflow with thousands of activities will accumulate a large event history. We mitigate this with event log compaction (configurable: keep last N events, or keep events newer than T days).

    KNOWN ISSUES & LIMITATIONS

    - Signal timeouts are wall-clock based and do not account for workflow pause/resume. A workflow that is paused for maintenance will still accumulate signal timeout.
    - The maximum event log size for a single workflow is 2 GB (hard limit in BadgerDB value size). Workflows exceeding this must be split into child workflows.
    - Cross-region workflow execution is not supported natively. Each River cluster is region-scoped. Multi-region orchestration must be implemented at the application layer.
    - Activity heartbeats are poll-based (default: 10s interval) rather than stream-based, which can cause up to 10s of delay in detecting worker failures.

