- question: |
    You are an expert software architect. Read the following detailed system design proposal for a distributed rate limiter and write a thorough design review covering: (1) whether the architecture meets the stated requirements, (2) potential failure modes and edge cases, (3) specific recommendations for improvement, (4) a risk assessment of the proposed approach. Be specific and reference details from the proposal.

    ========================================================================
    DESIGN PROPOSAL: Global Rate Limiting Service (GRLS) — Revision 3
    Author: Infrastructure Team | Status: Under Review | Date: 2024-09-20
    ========================================================================

    1. REQUIREMENTS

    Functional:
    - FR1: Enforce per-tenant rate limits across all API gateway instances globally
    - FR2: Support limit dimensions: requests/second, concurrent connections, bytes/minute
    - FR3: Provide a "dry-run" mode that logs violations without blocking traffic
    - FR4: Expose real-time usage metrics via a /limits API endpoint per tenant
    - FR5: Support hierarchical rate limits (organization → project → service-account)

    Non-Functional:
    - NFR1: P99 decision latency < 5ms
    - NFR2: Accuracy: limit enforcement within ±1% of configured threshold
    - NFR3: Availability: 99.999% uptime (failure must default to ALLOW)
    - NFR4: Scale: 10M requests/second peak across 200+ API gateway instances
    - NFR5: Consistency: at-most 500ms staleness for limit state across regions

    2. PROPOSED ARCHITECTURE

    2.1 Overview
    The GRLS uses a two-tier architecture:
    - Tier 1 (Fast Path): A per-instance in-process token bucket (embedded as a sidecar library) that handles 99.9% of rate-limit decisions locally with sub-microsecond latency.
    - Tier 2 (Global Path): A Redis Cluster (7 nodes, sharded by tenant_id) that synchronizes token state across instances every 100ms via a background goroutine.

    2.2 Tier 1 — Local Token Bucket
    Each gateway instance maintains a local LRU cache (max 100,000 entries) of token buckets. Each bucket stores:
    - tokens: current token count (float64)
    - last_refill: Unix timestamp of last refill
    - limit_config: rate, burst, window
    - generation: monotonically increasing version number

    Decision flow:
    1. Look up bucket in local LRU (hash map, O(1))
    2. If missing, create new bucket with full tokens = burst size, generation = 0
    3. Refill tokens based on elapsed time: tokens += rate * (now - last_refill)
    4. If tokens >= 1.0: decrement, return ALLOW
    5. If tokens < 1.0: check overflow queue; if queue not full, enqueue and return ALLOW with metadata
    6. Otherwise: return DENY with retry-after header

    The overflow queue is an optimization for burst-handling: it allows a configurable number of requests (default: 10% of burst) to pass even when the token bucket is empty, buffering against token synchronization lag.

    2.3 Tier 2 — Redis Synchronization
    A background sync loop runs every 100ms:
    1. Batch-collect all locally-modified buckets (those with generation > last_synced_generation)
    2. Send a Lua script to Redis that atomically:
       a. Fetches the current global token count for each key
       b. Subtracts the local consumption since last sync
       c. Returns the updated global token count
       d. Stores the new generation number
    3. Update local buckets with the globally-consistent token count

    The Lua script uses Redis HASH data type with fields:
    - global_tokens: remaining tokens (float64 stored as string)
    - last_sync_ts: timestamp of last synchronization
    - generation: version number for conflict detection

    2.4 Conflict Resolution
    If two instances sync simultaneously, Redis's single-threaded execution ensures atomic updates. The Lua script detects "stale" local generations (generation < stored generation) and applies only the delta rather than overwriting, preventing lost updates.

    2.5 Failure Modes
    - Redis unavailable: local bucket continues operating independently (fail-open); when Redis recovers, accumulated local tokens are reconciled
    - Local instance crash: token state is lost; Redis holds the authoritative global state
    - Network partition: each partition operates independently; upon healing, the Lua reconciliation script resolves discrepancies

    3. DEPLOYMENT TOPOLOGY

    - 200+ API gateway instances across 5 regions (us-east, us-west, eu-west, ap-southeast, ap-northeast)
    - Each region has a dedicated Redis Cluster (7 nodes per region) with cross-region async replication (500ms lag)
    - ZooKeeper ensemble (5 nodes) for Redis cluster discovery and leader election for the background sync coordinator
    - Prometheus + Grafana for monitoring with custom dashboards

    4. KNOWN LIMITATIONS (acknowledged by the proposal authors)

    - The 500ms cross-region replication lag means a tenant can briefly exceed their global limit if traffic is distributed across regions
    - The LRU cache eviction policy can cause a cold-start latency spike when a tenant's bucket is evicted and must be re-created
    - The overflow queue can be exploited: a sophisticated attacker could sustain bursts near the overflow threshold indefinitely
    - The float64 representation of tokens loses precision for very large token counts (> 2^53)

    5. ALTERNATIVES CONSIDERED

    - Centralized Redis-only: rejected due to P99 latency > 5ms (measured at 8-12ms for cross-AZ Redis calls)
    - Gossip-based sync (SWIM): rejected due to complexity of conflict resolution and debugging
    - Hardware token bucket (smart NIC offload): rejected due to cost ($12K per NIC × 200 instances)

    Please write a detailed design review.

  keywords:
    - "token bucket"
    - "Redis"
    - "fail-open"
    - "overflow queue"
    - "reconciliation"
    - "cross-region"
    - "cold-start"
    - "precision"
  max_tokens: 1024

- question: |
    You are a senior data engineer reviewing a migration strategy. Read the following detailed proposal for migrating a 360TB data warehouse from an on-premises Teradata system to a cloud-native architecture, and write a comprehensive risk assessment and implementation critique. You must: (1) identify the top 5 risks in order of severity, (2) for each risk, explain the potential blast radius and provide a concrete mitigation, (3) evaluate whether the proposed timeline is realistic, and (4) suggest at least 3 improvements the authors should consider before execution.

    ===========================================================================
    DATA WAREHOUSE MIGRATION STRATEGY: Teradata On-Prem → Cloud-Native
    Platform: AWS (Primary) / GCP (DR) | Target: Snowflake + dbt + Airflow
    ===========================================================================

    CURRENT STATE

    The existing Teradata system (v17.20) runs on a 24-node MPP cluster in the company's primary data center (Dallas, TX). Key statistics:
    - Total compressed storage: 360 TB across 8,247 tables
    - Daily ingestion: 3.2 TB across 1,840 ETL pipelines (Informatica PowerCenter)
    - Concurrent users: 850 (450 analysts, 250 BI tools, 150 automated jobs)
    - Peak query throughput: 340 queries/minute
    - Largest single table: `fact_customer_events` — 84 TB, 2.1 trillion rows, partitioned by date with 2,190 partitions
    - UDF library: 312 custom Teradata UDFs written in C and Java
    - Stored procedures: 1,840 stored procedures, totaling ~420,000 lines of code
    - Data retention policy: 7 years for financial data (PCI-DSS), 3 years for operational data

    TARGET ARCHITECTURE

    The target platform consists of:
    - Snowflake Enterprise Edition (multi-cluster warehouse, 3XL for heavy ETL, L for ad-hoc queries)
    - dbt Cloud for data transformation (replacing Informatica)
    - Apache Airflow 2.9 for orchestration
    - AWS S3 as the data lake staging layer
    - AWS Glue Data Catalog for schema registry
    - Fivetran for SaaS data source ingestion
    - Monte Carlo for data observability and quality monitoring

    MIGRATION PHASES (Proposed Timeline: 14 months)

    Phase 1 — Discovery & Assessment (Months 1-2):
    - Inventory all 8,247 tables with metadata (row counts, data types, null ratios, update patterns)
    - Classify tables: "lift-and-shift" (6,200 tables), "refactor" (1,800 tables), "deprecate" (247 tables)
    - Identify incompatible data types: Teradata-specific types (PERIOD, INTERVAL, UDT, JSON) must be converted
    - Audit UDF library: determine which 312 UDFs can be replaced with Snowflake native functions vs. rewritten in Python/Java UDFs vs. retired
    - Map 1,840 stored procedures to dbt models + Airflow DAGs

    Phase 2 — Infrastructure & Tooling (Months 2-4):
    - Provision Snowflake accounts (prod, staging, dev) with RBAC integration (Okta SSO)
    - Set up AWS Direct Connect (10 Gbps) between on-prem data center and AWS us-east-1
    - Deploy Apache Airflow on Kubernetes (EKS) with 50 worker nodes
    - Configure dbt Cloud with git integration (GitHub Enterprise) and CI/CD pipeline
    - Implement data quality framework using dbt tests + Monte Carlo monitors (200+ checks)

    Phase 3 — Initial Bulk Migration (Months 3-6):
    - Use AWS Snowball Edge (8 devices, 80 TB each) for the initial 360 TB bulk transfer
    - Teradata TPT (Teradata Parallel Transporter) to export tables in parallel (16 streams × 24 nodes)
    - Convert exported data to Parquet format (Snappy compression) during extraction
    - Load Parquet files to S3, then COPY INTO Snowflake using auto-ingest
    - Validate row counts, checksums (MD5 per partition), and schema integrity

    Phase 4 — Incremental Sync & Cutover (Months 5-10):
    - Implement Change Data Capture (CDC) using Teradata's Change Data Capture feature
    - Develop a Python-based CDC consumer that writes to S3 in micro-batches (every 5 minutes)
    - Run old and new systems in parallel for 6 weeks: compare query results between Teradata and Snowflake for top-500 most-queried tables
    - Gradual cutover by business unit (Finance → Marketing → Operations → Supply Chain)

    Phase 5 — Optimization & Decommission (Months 10-14):
    - Tune Snowflake clustering keys based on query patterns observed during parallel run
    - Optimize dbt models: implement incremental models, reduce materialization overhead
    - Decommission Teradata: final backup → data validation sign-off by each BU → power down
    - Post-migration performance baseline: ensure all SLA queries meet targets

    KNOWN CHALLENGES (identified by the migration team):

    1. The `fact_customer_events` table (84 TB, 2.1T rows) is append-only with 8,000 columns (wide-table design). Snowflake has a hard limit of 1,000 columns per table for certain operations (e.g., clustering). The team proposes splitting this into 8 vertical partitions (1,000 columns each) with a view that UNIONs them.

    2. Teradata UDFs that use C extensions for statistical computation (e.g., custom quantile functions, Holt-Winters forecasting) cannot be directly translated to Snowflake SQL UDFs. The team proposes rewriting these as Python UDFs in Snowflake, with an estimated effort of 4 person-weeks per UDF for the 40 most complex UDFs.

    3. The 10 Gbps Direct Connect may be insufficient for the CDC sync during parallel run. At 3.2 TB/day ingestion, the CDC stream alone will consume ~296 Mbps continuously, leaving only ~700 Mbps for the ongoing business traffic between on-prem and AWS.

    4. The 6-week parallel run window may be too short to catch all discrepancies, especially for monthly and quarterly batch jobs that only execute once per reporting cycle.

    Please write your risk assessment and implementation critique.

