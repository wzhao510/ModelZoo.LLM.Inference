- question: |
    You are an experienced network security engineer. Read the following incident report about a sophisticated network intrusion and write a detailed security post-mortem covering: (1) reconstruction of the attack timeline with MITRE ATT&CK technique mappings, (2) analysis of the attacker's TTPs (Tactics, Techniques, and Procedures), (3) what controls failed and why, (4) detection gaps that allowed the attacker to persist for 47 days, (5) prioritized remediation recommendations with effort estimates. Reference specific details.

    ========================================================================
    SECURITY INCIDENT REPORT: Advanced Persistent Threat Intrusion
    Incident ID: IR-2024-0042 | Classification: CRITICAL | Date Range: 2024-06-12 to 2024-07-29
    ========================================================================

    EXECUTIVE SUMMARY

    On July 29, 2024, during a routine threat-hunting exercise, the internal security team discovered an active command-and-control (C2) beacon on a Jenkins build server (build-node-14.internal.corp). Subsequent investigation revealed that an attacker had maintained persistent access to the corporate network for 47 days, exfiltrating approximately 4.7 GB of data including source code for 3 proprietary products, customer PII for 180,000 users, and internal design documents for unreleased products. The initial intrusion vector was a compromised CI/CD pipeline credential that was used to deploy a malicious Docker container to the build cluster.

    DETAILED TIMELINE

    Day 0 (June 12) — Initial Access:
    - 14:22 UTC: A developer's GitLab Personal Access Token (PAT) was exfiltrated via a credential-harvesting malware on the developer's personal laptop (macOS, unmanaged device). The developer had created a PAT with `api`, `read_repository`, and `write_repository` scopes on 2024-01-05 for a home automation project and had never rotated it.
    - 14:28 UTC: The attacker used the PAT to clone 14 private repositories, identifying the `infra/deployments` repo which contained Kubernetes deployment manifests and Helm charts.
    - 14:35 UTC: From the deployment manifests, the attacker identified the Harbor registry credentials stored as Kubernetes Secrets (base64-encoded, not encrypted with a KMS). These credentials had push access to the `build-images` project in Harbor.

    Day 0 (June 12) — Execution:
    - 15:10 UTC: The attacker built a malicious Docker image (`build-cache:v2.4.1`) containing a reverse-shell payload hidden in the image's ENTRYPOINT script. The payload was a Python-based C2 agent using WebSocket-over-TLS to communicate with a command server at `185.243.112.89` (a bulletproof hosting provider in a jurisdiction with weak law enforcement cooperation).
    - 15:18 UTC: The attacker pushed the malicious image to Harbor using the compromised credentials.
    - 15:22 UTC: The attacker modified the Jenkins pipeline definition (`Jenkinsfile`) for the `backend-services` project, changing the builder image from `build-cache:v2.4.0` to `build-cache:v2.4.1`. Because the Jenkinsfile was in a protected branch, the attacker created a merge request from a fork and approved it themselves using the compromised PAT (the PAT owner had Maintainer role).

    Day 1-3 (June 13-15) — Persistence:
    - The malicious container executed on build-node-14 during the nightly build. The C2 agent established a connection and the attacker began reconnaissance.
    - June 13: Attacker deployed a secondary persistence mechanism — a systemd timer (`systemd-dbus-service.timer`) that re-downloaded the C2 agent from a GitHub gist every 30 minutes. This ensured persistence even if the malicious container was removed.
    - June 14: Attacker discovered an SSH private key (`id_rsa_deploy`) on build-node-14, left in `/home/jenkins/.ssh/` without a passphrase. This key had passwordless SSH access to 847 servers (all backend production nodes, staging, and QA environments).
    - June 15: Attacker used the SSH key to deploy the C2 agent to 12 additional servers, including the primary database server (db-master-01) and the internal package registry (pkg-registry-01).

    Day 4-39 (June 16 - July 21) — Lateral Movement & Collection:
    - Attacker enumerated the network using `nmap`, `masscan`, and `ldapsearch` queries against Active Directory. They mapped the entire internal network topology (approximately 2,400 hosts) within 4 days.
    - June 18: Attacker accessed the internal Confluence wiki and exfiltrated documentation for 3 proprietary products (total: 2.1 GB).
    - June 22: Attacker dumped the PostgreSQL database for the customer-facing application from db-master-01 using `pg_dump`. The database contained PII (names, emails, hashed passwords, phone numbers, addresses) for 180,000 customers. Data exfiltration was chunked into 5 MB archives and sent via DNS tunneling (TXT queries to a domain controlled by the attacker). DNS tunneling was chosen because outbound DNS was unrestricted — the corporate firewall blocked direct TCP connections to unknown IPs but allowed all outbound DNS queries.
    - July 5: Attacker accessed the internal GitLab instance and exfiltrated full git history (including deleted branches and force-pushed commits) for 22 repositories. They used `git bundle` to package the repositories for exfiltration.
    - July 10: Attacker discovered credentials for the corporate AWS account (access key + secret key) stored in a configuration file on a staging server. These credentials had `AdministratorAccess` policy attached (no IAM boundary). The attacker used them to enumerate S3 buckets (found 840 buckets) and exfiltrated data from 12 buckets containing product design documents and financial projections.

    Day 40-47 (July 22-29) — Detection:
    - July 29, 10:00 UTC: A threat-hunting query on Zeek (network monitoring) logs looking for "unusual DNS query volume by source IP" flagged build-node-14 as the #1 source of DNS TXT queries on the network, with 3,200x the median volume. The security analyst (Jane) escalated for investigation.
    - July 29, 10:30 UTC: Jane examined build-node-14 and found: the systemd timer `systemd-dbus-service.timer` (suspicious, named to look like a system service), outbound connections to 185.243.112.89:443, the unauthorized SSH key in /home/jenkins/.ssh/, and the malicious Docker image still active in the build pipeline
    - July 29, 11:00 UTC: Security Incident declared. Incident Response team convened.

    IMMEDIATE CONTAINMENT (July 29):
    - 11:15 UTC: Isolated build-node-14 and the 12 other compromised hosts from the network (switch port shutdown)
    - 11:30 UTC: Revoked all compromised credentials (GitLab PAT, Harbor credentials, SSH deploy key, AWS access keys) — total: 16 credentials across 5 systems
    - 12:00 UTC: Blocked 185.243.112.89 and associated IP range (185.243.112.0/24) at the perimeter firewall
    - 12:30 UTC: Initiated forced password reset for all 1,200 employees
    - 14:00 UTC: Engaged external incident response firm (Mandiant) for forensic investigation

    CONTROL FAILURES IDENTIFIED:

    1. No PAT rotation policy: GitLab Personal Access Tokens had no expiry enforcement (the company policy recommended 90-day rotation but did not enforce it technically). The compromised PAT was 190 days old.

    2. Kubernetes Secrets not encrypted at rest: The cluster used base64-encoded Secrets without envelope encryption via KMS. Any user with `get secrets` permission (which included all Jenkins service accounts) could decode the Harbor credentials.

    3. Missing egress filtering: The corporate firewall allowed all outbound DNS (TCP/UDP 53) to any destination. DNS tunneling was a known technique in the threat model but was accepted as a risk due to "operational complexity of DNS filtering."

    4. SSH key sprawl: The `id_rsa_deploy` key on build-node-14 provided passwordless access to 847 servers. No SSH key inventory existed, and no certificate-based SSH authentication was in place.

    5. No canary/deception technology: The attacker moved laterally undetected for 47 days. No honeytokens, canary files, or deception hosts were deployed that could have triggered an alert.

    6. IAM privilege escalation path: The AWS credentials on the staging server had AdministratorAccess. The principle of least privilege was not applied.

    7. Developer personal devices: The initial compromise vector (developer's personal laptop) was unmanaged, had no EDR agent, and was not subject to corporate security policies.

    8. Blind spot in monitoring: The security team had dashboards for "top talkers by bytes" but NOT "top talkers by DNS query count." The DNS tunneling was detected by a manual threat-hunting query, not by an automated alert.

    ENCRYPTED DATA AT REST: The exfiltrated database contained bcrypt-hashed passwords (cost factor 12). No plaintext passwords were exposed.

    REGULATORY NOTIFICATION STATUS: GDPR notification required (180,000 EU data subjects). 72-hour notification deadline met on August 1. CCPA notification required (affected California residents). SEC 8-K filing under consideration (potential material impact).

    Please write the full security post-mortem.

