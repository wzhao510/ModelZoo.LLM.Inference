      data led to forgetting.
    - LoRA rank: r=128, alpha=256, dropout=0.05
    - Hardware: 8× NVIDIA A100-80GB (1 node)
    - Training duration: 26 hours
    - HumanEval pass@1: 73.1% (↑ 5.9pp from baseline)
    - MBPP pass@1: 65.2% (↑ 6.8pp from baseline)
    - LiveCodeBench: 51.3% (↑ 8.5pp from baseline)
    - MMLU: 71.0 (↓ 0.2pp from baseline — within noise)
    - HellaSwag: 83.0 (↓ 0.1pp from baseline — within noise)
    - Analysis: BEST RESULT SO FAR. Adding general instruction data prevented forgetting entirely
      while achieving the highest code generation scores. The ratio 70:30 was chosen somewhat
      arbitrarily — the team did not perform a systematic sweep of mixing ratios.

    EXPERIMENT #5 — DPO (Direct Preference Optimization) on Top of Exp #4:
    - Method: DPO fine-tuning on top of Exp #4 checkpoint, using 12K preference pairs
      (chosen: human-written solution, rejected: model-generated solution from Exp #4)
    - Preference pairs constructed from HumanEval+ training split and internal code review data
    - LoRA rank: r=64, beta=0.1, learning_rate=5e-6
    - Hardware: 8× NVIDIA A100-80GB
    - Training duration: 8 hours
    - HumanEval pass@1: 75.8% (↑ 8.6pp from baseline, ↑ 2.7pp from Exp #4)
    - MBPP pass@1: 67.1% (↑ 8.7pp from baseline)
    - LiveCodeBench: 54.2% (↑ 11.4pp from baseline)
    - Analysis: DPO PROVIDED MEANINGFUL GAINS beyond SFT. The model learned to prefer
      human-like code style (better variable names, more idiomatic patterns, fewer unnecessary
      comments). However, the 12K preference pairs were relatively few; the team noted that
      DPO performance was sensitive to the quality of the "rejected" samples. Bad rejections
      (where the model output was actually reasonable) confused the training signal.

    EXPERIMENT #6 — Sequence Length Extension (RoPE theta scaling):
    - Method: Extended max_seq_len from 4096 to 16384 using RoPE theta scaling
