- question: |
    You are a seasoned PostgreSQL DBA. Read the following detailed investigation report on a mysterious database performance degradation and write a comprehensive root cause analysis and remediation plan. Cover: (1) the full causal chain from symptom to root cause, (2) why each diagnostic step was necessary and what it revealed, (3) the specific PostgreSQL internals involved, (4) immediate fixes applied, (5) long-term architectural changes recommended. Use specific details from the report.

    ========================================================================
    POSTGRESQL PERFORMANCE DEGRADATION INVESTIGATION — Case #DB-2024-0731
    System: Core Transaction Database | PostgreSQL 15.4 | AWS RDS db.r6g.16xlarge
    ========================================================================

    INITIAL SYMPTOMS (Reported 2024-09-03 08:30 UTC)

    At approximately 07:15 UTC, the payment-processing application began reporting elevated P99 latency: normally 45ms, now spiking to 3,200ms. Error rate remained 0% — no failed transactions, just extreme slowness. The degradation was gradual, building over approximately 45 minutes rather than a sudden step change.

    DIAGNOSTIC STEP 1 — CHECK ACTIVE QUERIES (08:35 UTC)

    Ran: `SELECT pid, now() - pg_stat_activity.query_start AS duration, query FROM pg_stat_activity WHERE state != 'idle' ORDER BY duration DESC;`

    Finding: No long-running queries. The longest-running query was 4.2 seconds (a normal batch reconciliation job). Nothing was stuck or blocking. This ruled out: uncommitted transactions holding locks, a single slow query causing queueing, and deadlocks.

    DIAGNOSTIC STEP 2 — CHECK WAIT EVENTS (08:38 UTC)

    Ran: `SELECT wait_event_type, wait_event, count(*) FROM pg_stat_activity WHERE state != 'idle' GROUP BY 1, 2 ORDER BY 3 DESC;`

    Finding:
    ```
    wait_event_type | wait_event  | count
    ----------------+-------------+-------
    IO              | DataFileRead|   47
    LWLock          | WALWrite    |   23
    LWLock          | BufferMapping|  12
    IO              | WALRead     |    8
    ```

    This was the first strong signal: 47 backends were waiting on DataFileRead (random disk reads). The database was I/O-bound, not CPU-bound or lock-bound. The WALWrite contention (23 backends) was secondary but notable — it suggested write throughput was also elevated.

    DIAGNOSTIC STEP 3 — CHECK CHECKPOINT ACTIVITY (08:42 UTC)

    Ran: `SELECT * FROM pg_stat_bgwriter;`

    Finding:
    - checkpoints_timed: 847 (normal for uptime)
    - checkpoints_req: 1,294 in the last hour (NORMAL: ~20/hour)
    - buffers_checkpoint: 3.2 million pages in the last hour (NORMAL: ~50,000)
    - buffers_clean: 12.4 million pages in the last hour (NORMAL: ~200,000)
    - maxwritten_clean: 847,000 in the last hour (NORMAL: ~1,000)

    INTERPRETATION: The database was experiencing EXTREME checkpoint pressure. Instead of ~20 checkpoints per hour, we were triggering 1,294 — roughly one checkpoint every 2.8 seconds. Each checkpoint was writing an enormous number of dirty buffers (3.2M pages/hour vs normal 50K — 64x the normal rate). The background writer was also struggling, with `maxwritten_clean` at 847x normal levels, indicating that the bgwriter was being interrupted mid-scan because it kept finding more dirty pages to clean.

    DIAGNOSTIC STEP 4 — CHECK WAL ACTIVITY (08:45 UTC)

    Ran: `SELECT pg_current_wal_lsn(), pg_wal_lsn_diff(pg_current_wal_lsn(), '0/0') AS wal_bytes;` (waited 60 seconds, then repeated)

    Finding: WAL generation rate was 384 MB/minute (NORMAL: ~15 MB/minute). This is 25x normal. At this rate, the 200 GB WAL volume would fill in approximately 8.7 hours, triggering an emergency shutdown if not addressed.

    DIAGNOSTIC STEP 5 — CHECK TABLE WRITE ACTIVITY (08:48 UTC)

    Ran: `SELECT relname, n_tup_ins, n_tup_upd, n_tup_del, n_tup_hot_upd, seq_scan, idx_scan FROM pg_stat_user_tables ORDER BY (n_tup_ins + n_tup_upd + n_tup_del) DESC LIMIT 10;` (captured, waited 60s, captured again, computed delta)

    Finding:
    | Table | Inserts/min | Updates/min | Deletes/min | HOT Updates |
    |-------|-------------|-------------|-------------|-------------|
    | payment_transactions | 12,400 | 8,200 | 0 | 820 (10%) |
    | payment_audit_log | 97,000 | 0 | 0 | N/A |
    | transaction_events | 43,000 | 0 | 0 | N/A |
    | user_sessions | 0 | 62,000 | 1,200 | 61,800 (99.7%) |
    | All other tables | <1,000 | <500 | <100 | Normal |

    THE SMOKING GUN: `payment_audit_log` was receiving 97,000 inserts per minute (normal: ~3,000). `transaction_events` was receiving 43,000 inserts per minute (normal: ~1,500). Total combined: 140,000 rows/minute of insert activity that shouldn't exist.

    DIAGNOSTIC STEP 6 — TRACE THE SOURCE (08:52 UTC)

    Queried `payment_audit_log` for recent entries:
    ```sql
    SELECT event_type, COUNT(*), MIN(created_at), MAX(created_at)
    FROM payment_audit_log
    WHERE created_at > NOW() - INTERVAL '2 hours'
    GROUP BY event_type
    ORDER BY 2 DESC;
    ```

    Finding:
    | event_type | count | min_created_at | max_created_at |
    |------------|-------|----------------|----------------|
    | payment_retry_check | 4,821,403 | 07:15 | 08:52 |
    | payment_status_poll | 2,103,921 | 07:15 | 08:52 |
    | All other types | 12,482 | 06:00 | 08:52 |

    99.8% of audit log entries were `payment_retry_check` — a debug event that was introduced in a code change deployed at 07:10 UTC (5 minutes before the degradation began). The PR (#18734, "Add retry diagnostics for payment timeout investigation") added a `logger.info()` call inside the payment retry loop, and the logger was configured to write to the database audit log.

    ROOT CAUSE IDENTIFIED (08:55 UTC)

    1. PR #18734 deployed at 07:10 UTC added verbose logging inside a tight retry loop
    2. The retry loop executes up to 5 retries per payment, at ~2,000 payments/second peak throughput
    3. Each retry generates 2 DB audit log entries (retry_check + status_poll)
    4. Maximum DB writes: 2,000 × 5 × 2 = 20,000 writes/second above normal
    5. These writes: filled WAL at 25x normal rate, triggered checkpoints every 2.8s instead of every 3 minutes, saturated the EBS volume's IOPS (20,000 provisioned IOPS on gp3), and caused all other queries to queue behind the checkpoint I/O storm
    6. The P99 latency spike to 3,200ms was entirely due to I/O wait — the same queries ran at 45ms once the audit log flood was stopped

    IMMEDIATE REMEDIATION (09:02 UTC)

    - Reverted PR #18734 via emergency deployment pipeline
    - Manually issued `CHECKPOINT` to flush all pending dirty buffers (took 4 minutes)
    - Ran `VACUUM ANALYZE payment_audit_log` to update statistics (the autovacuum had fallen behind due to the write volume)
    - P99 latency returned to 45ms by 09:08 UTC

    LONG-TERM OBSERVATIONS

    This incident exposed several systemic weaknesses:
    - The audit log table had NO rate limiting. Any code path could write unlimited entries.
    - There was no alert on `checkpoints_req` rate (the team was only alerting on `checkpoints_timed`, which was normal)
    - The EBS volume's 20,000 IOPS was the bottleneck; the team had provisioned for normal throughput but had no headroom for anomalies
    - The deployment pipeline had no canary stage for backend service changes (unlike the frontend, which had a full canary → staging → production pipeline)
    - The relationship between DB write volume → WAL pressure → checkpoint frequency → I/O saturation was well-understood by the DBA team but not documented in the developer onboarding guide

    Please write the full root cause analysis and remediation plan.

  keywords:
