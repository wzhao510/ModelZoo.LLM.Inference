    - RepoBench (long-context, multi-file): 62.3% (baseline CodeLlama-70B: 48.7%, Exp #5: 51.4%)
    - Analysis: TRADE-OFF ACCEPTED. Slight regression on short-form benchmarks in exchange for
      dramatic improvement on long-context code tasks (+13.6pp on RepoBench vs baseline).
      The RoPE scaling approach worked well for extending context without full re-training,
      but the 500-step fine-tuning was insufficient for the model to fully adapt its attention
      patterns to the longer context. The team believes additional training steps would close
      the short-form gap.

