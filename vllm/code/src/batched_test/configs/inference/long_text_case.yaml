    - Trainable parameters: 0.8% of total (560M / 70B)
    - Hardware: 8× NVIDIA A100-80GB (1 node)
    - Training duration: 18 hours
    - HumanEval pass@1: 69.1% (↑ 1.9pp from baseline)
    - MBPP pass@1: 60.2% (↑ 1.8pp from baseline)
    - LiveCodeBench: 45.3% (↑ 2.5pp from baseline)
    - Training loss: 2.3 → 1.12
    - Analysis: MODEST IMPROVEMENT with no forgetting (MMLU: 70.8, HellaSwag: 82.9 — within noise).
      The LoRA approach preserved general capabilities while adding Python-specific knowledge. However,
      the improvement was smaller than expected. The team hypothesized that r=64 might be too small
      to capture the complexity of code generation patterns. Additionally, the dataset still had quality
      issues: ~15% of samples contained broken code (identified in post-hoc analysis via Pyright type-checking).

    EXPERIMENT #3 — Data Filtering + LoRA (r=128):
    - Method: Same as Exp #2 but with filtered dataset (removed samples that fail Pyright type-checking
      with strict mode, removed duplicate/near-duplicate samples via MinHash LSH with threshold 0.85)
    - Dataset after filtering: 184K samples (down from 240K, 23.3% removed)
    - LoRA rank: r=128, alpha=256, dropout=0.05
    - Trainable parameters: 1.6% of total
    - Hardware: 8× NVIDIA A100-80GB (1 node)
    - Training duration: 22 hours
    - HumanEval pass@1: 72.4% (↑ 5.2pp from baseline)
    - MBPP pass@1: 64.8% (↑ 6.4pp from baseline)
    - LiveCodeBench: 49.7% (↑ 6.9pp from baseline)
    - Training loss: 2.3 → 0.94
    - Analysis: SIGNIFICANT IMPROVEMENT. Data quality mattered more than parameter count.
      The Pyright filtering removed syntactically-invalid and type-inconsistent samples, which had
      been teaching the model bad habits. MinHash deduplication removed 18K near-duplicate samples
      that were biasing the model toward common patterns in the training data.

    EXPERIMENT #4 — Data Mixing (Code + General):
    - Method: Mixed dataset — 70% filtered Python (184K samples) + 30% general instructions
