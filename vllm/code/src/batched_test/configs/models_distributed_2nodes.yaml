# 多机(分布式)推理测试模型清单
# 格式与 configs/models_single_QA_required.yaml 一致, 由
#   multinode_tp16/config.sh 加载(可用 MODEL_CONFIG 覆盖路径)。
#
# 说明:
#   - 每个模型用 serve_config.tp/dp/pp 描述并行度, 需要的卡数 = tp*dp*pp;
#     脚本按 GPUS_PER_NODE(默认 8)推导节点数 NNODES = 卡数 / GPUS_PER_NODE。
#   - 因此这里放的是单机 8 卡跑不动、需要多机的大模型, 单机模型请放 configs/model.yaml。
#   - 清单里"列出来的模型"就是执行列表(按文件顺序依次跑);
#     不想跑的注释掉, 或加一行 skip: true 保留在文件里但不执行。
#     临时只跑某几个: MODELS_SOURCE=env MODELS=<name>[,<name>...]
#   - 切换模型名: MODEL_NAME=<name>, 例如
#       MODEL_NAME=GLM-5-W8A8 RANK=0 bash start.sh
#
# 常用: 宁夏 C500x8 x2 (TP16, GPUS_PER_NODE=8)
#       上海 C600U x16 x2 (TP32, GPUS_PER_NODE=16)

# ---------- 上海 C600U(每节点 16 卡, 两机 TP32) ----------

# - name: Kimi-K2.5-FP8
#   # 上海 C600U 分布式: 每节点 16x MXC600U, 两机 TP32, 需 GPUS_PER_NODE=16
#   model_path: /mnt/hdd1/vllm/Kimi-K2.5-FP8/
#   serve_config:
#     tp: 32
#     dp: 1
#     pp: 1
#     extra_args:
#       --max-num-batched-tokens: 8192
#   infer_type:
#   - text-only
#   benchmark:
#     bench_param: configs/bench_params/bench_default.json
#     sweep_num_runs: 1
#   extra_env:

# ---------- 默认执行列表(原 config.sh 里的 3 个) ----------

- name: DeepSeek-R1-0528-W8A8
  model_path: /mxstorage/pde_ai/models/llm/DeepSeek/DeepSeek-R1-W8A8/vllm_quant_model
  serve_config:
    tp: 16
    dp: 1
    pp: 1
    extra_args:
      --dtype: bfloat16
  infer_type:
  - text-only
  benchmark:
    bench_param: configs/bench_params/bench_mainstream_highlight.json
    ignore_eos: true
    sweep_num_runs: 1
  extra_env:

- name: GLM-5.2-W8A8
  model_path: /mxstorage/pde_ai/models/llm/ChatGLM/GLM-5_2-W8A8/
  serve_config:
    tp: 16
    dp: 1
    pp: 1
    extra_args:
      --dtype: bfloat16
  infer_type:
  - text-only
  benchmark:
    bench_param: configs/bench_params/bench_mainstream_highlight.json
    ignore_eos: true
    sweep_num_runs: 1
  extra_env:

- name: Kimi-K2.6-Int4
  # 注意: Kimi-K2.6-W8A8(Int4) 在当前 vllm-metax 0.25 构建下 auto-detect
  #       compressed-tensors 会崩, 暂用 bf16 版本; 修复后可改回
  #       /mxstorage/pde_ai/models/llm/Kimi/Kimi-K2.6-W8A8/
  model_path: /mxstorage/pde_ai/models/llm/Kimi/Kimi-K2.6/
  serve_config:
    tp: 16
    dp: 1
    pp: 1
    extra_args:
      --dtype: bfloat16
  infer_type:
  - text-only
  benchmark:
    bench_param: configs/bench_params/bench_mainstream_highlight.json
    ignore_eos: true
    sweep_num_runs: 1
  extra_env:

- name: ERNIE-4.5-300B-A47B-PT
  timeout: 3600
  model_path: /mxstorage/pde_ai/models/llm/ERNIE/ERNIE-4.5-300B-A47B-PT
  serve_config:
    tp: 8
    dp: 1
    pp: 2
    extra_args:
  infer_type:
  - text-only
  benchmark:
    bench_param: configs/bench_params/bench_default.json
    sweep_num_runs: 1
  extra_env:
  tags:
  - moe

- name: MiMo-V2-Flash-BF16_W8A8_WITH_MTP
  timeout: 3600
  model_path: /mxstorage/pde_ai/models/model_quant_opt/Mimo/MiMo-V2-Flash-BF16_W8A8_WITH_MTP/vllm_quant_model
  serve_config:
    tp: 8
    dp: 2
    pp: 1
    extra_args:
      --speculative-config: '{"num_speculative_tokens":2,"method":"deepseek_mtp"}'
  infer_type:
  - text-only
  benchmark:
    bench_param: configs/bench_params/bench_default.json
    sweep_num_runs: 1
  # transformers>=4.57 误判 MiMo 为 Mistral 家族(config.json 没写 model_type)会报
  # "incorrect regex pattern" 警告; MiMo 的 tokenizer 本来就是这个老正则, 不要加
  # fix_mistral_regex, 这里只把这条警告压掉
  extra_env:
    TRANSFORMERS_VERBOSITY: error

- name: Hunyuan-3
  model_path: /mxstorage/pde_ai/models/llm/Hunyuan/Hy3
  serve_config:
    tp: 16
    dp: 1
    pp: 1
    gpu_memory_utilization: 0.9
    extra_args:
  infer_type:
  - text-only
  benchmark:
    bench_param: configs/bench_params/bench_high.json
    sweep_num_runs: 1
  extra_env:

# ---------- EP / PP 专项(两机 16 卡) ----------

- name: Qwen3-235B-A22B-W8A8-EP
  # 专家并行: MoE 的专家切到 16 个 rank 上(--enable-expert-parallel), tp16 两机
  timeout: 3600
  model_path: /mxstorage/pde_ai/models/llm/Qwen/Qwen3-235B-A22B.w8a8
  serve_config:
    tp: 8
    dp: 2
    pp: 1
    extra_args:
      --enable-expert-parallel:
  infer_type:
  - text-only
  benchmark:
    bench_param: configs/bench_params/bench_default.json
    sweep_num_runs: 1
  extra_env:
  tags:
  - moe

- name: GLM-5.2-W8A8-PP
  # 流水并行: 层切到两个 stage 上(tp8*pp2), 与 tp16 的 GLM-5.2-W8A8 对照
  timeout: 3600
  model_path: /mxstorage/pde_ai/models/llm/ChatGLM/GLM-5_2-W8A8/
  serve_config:
    tp: 8
    dp: 1
    pp: 2
    extra_args:
      --dtype: bfloat16
  infer_type:
  - text-only
  benchmark:
    bench_param: configs/bench_params/bench_default.json
    sweep_num_runs: 1
  extra_env:
  tags:
  - moe
