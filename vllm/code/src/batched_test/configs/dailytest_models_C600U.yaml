# C600-U 平台日测模型配置
# 对应测试矩阵 C600-U=true 的模型（仅 Qwen3.5-35B-A3B-W8A8-FP8，仅在 C600-U 平台测试）。

- name: "Qwen3.5-35B-A3B-W8A8-FP8"
  model_path: "/pde_ai/models/llm/Qwen/Qwen3.5-35B-A3B.w8a8"   # TODO: 验证路径（FP8 版本路径待确认）
  serve_config:
    tp: 1
    dp: 1
    pp: 1
    extra_args:
      --dtype: "bfloat16"
      --gpu-memory-utilization: 0.95
  infer_type:
    - text-only
  benchmark:
    bench_param: "configs/bench_params/bench_mainstream_highlight.json"
    ignore_eos: true
    sweep_num_runs: 1
  extra_env:
