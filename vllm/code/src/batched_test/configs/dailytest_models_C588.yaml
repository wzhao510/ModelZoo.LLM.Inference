# C588 平台日测模型配置
# 对应测试矩阵 C588=true 的全部模型；路径取自 C600-1/C600-2/model.yaml 已有配置。

# ---------- 2 卡 ----------
- name: "Qwen3-32B"
  model_path: "/mxstorage/pde_ai/models/llm/Qwen/Qwen3-32B/"
  serve_config:
    tp: 2
    dp: 1
    pp: 1
    extra_args:
      --dtype: "bfloat16"
      --gpu-memory-utilization: 0.9
  infer_type:
    - text-only
  benchmark:
    bench_param: "configs/bench_params/bench_mainstream_highlight.json"
    ignore_eos: true
    sweep_num_runs: 1
  extra_env:

- name: "Qwen3-Next-80B-A3B-Instruct_w8a8"
